services:
  booking-service:
    environment:
      BOOKING_HOTEL_BASE_URL: http://fault-proxy:8090
      BOOKING_HOTEL_READ_TIMEOUT: 2s
      BOOKING_HOTEL_CIRCUIT_MINIMUM_CALLS: 100
      BOOKING_HOTEL_CIRCUIT_WINDOW: 100
    depends_on:
      fault-proxy:
        condition: service_healthy
  fault-proxy:
    build:
      context: .
      target: fault-proxy
    init: true
    restart: "no"
    mem_limit: 192m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${FAULT_PORT}:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8090/__control > /dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60
