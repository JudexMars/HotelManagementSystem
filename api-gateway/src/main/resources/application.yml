spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-docs
              uri: lb://booking-service
              predicates:
                - Path=/v3/api-docs/booking
              filters:
                - SetPath=/v3/api-docs
            - id: hotel-docs
              uri: lb://hotel-service
              predicates:
                - Path=/v3/api-docs/hotel
              filters:
                - SetPath=/v3/api-docs
            - id: booking-api
              uri: lb://booking-service
              predicates:
                - Path=/api/users,/api/users/**,/api/bookings,/api/bookings/**
            - id: hotel-api
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels,/api/hotels/**,/api/rooms,/api/rooms/**
            - id: hotel-readiness
              uri: lb://hotel-service
              predicates:
                - Path=/health/hotel
              filters:
                - SetPath=/actuator/health/readiness
            - id: booking-readiness
              uri: lb://booking-service
              predicates:
                - Path=/health/booking
              filters:
                - SetPath=/actuator/health/readiness
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

springdoc:
  swagger-ui:
    urls:
      - name: Booking
        url: /v3/api-docs/booking
      - name: Hotel
        url: /v3/api-docs/hotel

logging:
  structured:
    format:
      console: logstash
